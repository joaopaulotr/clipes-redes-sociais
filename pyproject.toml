[project]
name = "clipes"
version = "0.1.0"
description = "Clipador sob demanda: envia um vídeo, recebe vários clipes 9:16 para revisar"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "yt-dlp>=2025.1.1",
    "chat-downloader>=0.2.8",
    "faster-whisper>=1.1",
    "numpy>=1.26",
    "openai>=1.60",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true
